<!DOCTYPE html>

<canvas id="screen" width="180" height="320"></canvas>

<script>
'use strict';
// ============================================================
//  Framebuffer 180x320 (9:16). Tudo é desenhado pixel a pixel.
// ============================================================
const W = 180, H = 320;
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
const img = ctx.createImageData(W, H);
const buf = new Uint32Array(img.data.buffer);

function C(hex) { // '#rrggbb' -> uint32 ABGR (little endian)
  const n = parseInt(hex.slice(1), 16);

}
const PAL = {
  space: C('#070a1f'), space2: C('#0d1233'), star: C('#ffffff'), star2: C('#8fa3d9'), star3: C('#3c4a80'),
  oceanD: C('#1a4790'), ocean: C('#2a6fcf'), oceanL: C('#4b93e6'),
  land: C('#3f9b4a'), landD: C('#2b6e36'), landL: C('#69c25a'), sand: C('#c9b36b'),
  ice: C('#e8f1ff'), cloud: C('#f4f8ff'), cloudD: C('#b9c8e6'),
  nightO: C('#0b1a3d'), nightL: C('#10291a'), city: C('#ffd36b'),
  atmo: C('#6fd3ff'), atmo2: C('#2c7fd0'),
  white: C('#ffffff'), gray: C('#9aa4b8'), grayD: C('#5b6378'), grayL: C('#d9dee8'), black: C('#000000'),
  panel: C('#3d6fe0'), panelD: C('#22408a'), panelL: C('#7aa2ff'),
  yellow: C('#ffd23f'), orange: C('#ff8c1a'), red: C('#ff3b3b'), laser: C('#ff4d6d'), laserL: C('#ffb3c1'),
  cyan: C('#4cc9f0'), green: C('#5be37a'), pink: C('#ff7ab6'),
  grass: C('#2d6a35'), grassL: C('#3f8a45'), dirt: C('#4a3222'), dirtD: C('#2e1f15'),
  wall: C('#e8d5b0'), wallD: C('#b89d70'), roof: C('#b8442f'), roofD: C('#7f2a1c'), win: C('#ffe08a'),
  shadow: C('#05061a'), tagBg: C('#1b2a6b'), fiber: C('#ff9f1c'),
};

function px(x, y, c) {
  x |= 0; y |= 0;
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  buf[y * W + x] = c;
}
function rect(x, y, w, h, c) {
  x |= 0; y |= 0;
  const x0 = Math.max(0, x), y0 = Math.max(0, y), x1 = Math.min(W, x + w), y1 = Math.min(H, y + h);
  for (let j = y0; j < y1; j++) for (let i = x0; i < x1; i++) buf[j * W + i] = c;
}
function disc(cx, cy, r, c) {
  for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++)
    if (i * i + j * j <= r * r + r * 0.8) px(cx + i, cy + j, c);
}
function ring(cx, cy, r, c, dash = 0, phase = 0) {
  const n = Math.max(12, Math.round(r * 7));
  for (let k = 0; k < n; k++) {
    if (dash && ((k + phase) % (dash * 2)) >= dash) continue;
    const a = k / n * Math.PI * 2;
    px(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r), c);
  }
}
// linha Bresenham; dash = comprimento do traço (0 = contínua); phase anima "formiguinhas"
function line(x0, y0, x1, y1, c, dash = 0, phase = 0) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy, k = 0;
  for (;;) {
    if (!dash || (((k + Math.floor(phase)) % (dash * 2)) + dash * 2) % (dash * 2) < dash) px(x0, y0, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }

}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);

// ---------- aleatório determinístico + ruído periódico ----------
function hash(a, b) {

function vnoise(x, y, period) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const p = (v) => ((v % period) + period) % period;
  const a = hash(p(ix), iy), b = hash(p(ix + 1), iy), c = hash(p(ix), iy + 1), d = hash(p(ix + 1), iy + 1);

// ============================================================

  ':':'00000,01100,01100,00000,01100,01100,00000','-':'00000,00000,00000,11111,00000,00000,00000',
  '(':'00010,00100,01000,01000,01000,00100,00010',')':'01000,00100,00010,00010,00010,00100,01000',
  '/':'00001,00010,00010,00100,01000,01000,10000','!':'00100,00100,00100,00100,00100,00000,00100',
  '?':'01110,10001,00001,00010,00100,00000,00100','≈':'00000,01101,10110,00000,01101,10110,00000',
  '~':'00000,00000,01101,10110,00000,00000,00000','→':'00000,00100,00010,11111,00010,00100,00000',
  '↓':'00100,00100,00100,00100,10101,01110,00100','↔':'00000,00000,01010,11111,01010,00000,00000',
  '+':'00000,00100,00100,11111,00100,00100,00000','=':'00000,00000,11111,00000,11111,00000,00000',
  '%':'11000,11001,00010,00100,01000,10011,00011',"'":'00100,00100,01000,00000,00000,00000,00000',
  '>':'01000,00100,00010,00001,00010,00100,01000','<':'00010,00100,01000,10000,01000,00100,00010',
  ' ':'00000,00000,00000,00000,00000,00000,00000',

const ACC = { acute: '00010,00100', grave: '01000,00100', circ: '00100,01010', tilde: '01101,10110', ced: '00100,01100' };
const COMPOSED = { 'Á':['A','acute'],'À':['A','grave'],'Â':['A','circ'],'Ã':['A','tilde'],'É':['E','acute'],
  'Ê':['E','circ'],'Í':['I','acute'],'Ó':['O','acute'],'Ô':['O','circ'],'Õ':['O','tilde'],'Ú':['U','acute'],'Ç':['C','ced'] };
const GLY = {};
for (const k in G) GLY[k] = G[k].split(',');
const ACCR = {}; for (const k in ACC) ACCR[k] = ACC[k].split(',');

function glyph(ch, x, y, s, c) {
  let base = ch, acc = null;
  if (COMPOSED[ch]) [base, acc] = COMPOSED[ch];
  const rows = GLY[base] || GLY['?'];
  for (let r = 0; r < 7; r++) for (let q = 0; q < 5; q++)
    if (rows[r][q] === '1') rect(x + q * s, y + r * s, s, s, c);
  if (acc) {
    const ar = ACCR[acc], oy = acc === 'ced' ? 7 : -3;
    for (let r = 0; r < 2; r++) for (let q = 0; q < 5; q++)
      if (ar[r][q] === '1') rect(x + q * s, y + (oy + r) * s, s, s, c);

const textW = (str, s = 1) => str.length * 6 * s - s;
// desenha texto com sombra; reveal = nº de caracteres visíveis (efeito máquina de escrever)
function text(str, x, y, c = PAL.white, { s = 1, align = 'center', reveal = Infinity, sh = PAL.shadow } = {}) {
  const w = textW(str, s);
  let x0 = align === 'center' ? Math.round(x - w / 2) : align === 'right' ? x - w : x;
  const n = Math.min(str.length, Math.floor(reveal));
  for (let i = 0; i < n; i++) {
    const ch = str[i];
    if (ch === ' ') continue;
    if (sh !== null) { glyph(ch, x0 + i * 6 * s + s, y + s, s, sh); glyph(ch, x0 + i * 6 * s, y + s, s, sh); }
    glyph(ch, x0 + i * 6 * s, y, s, c);

// bloco de linhas com máquina de escrever; retorna o tempo em que termina
function typeLines(lines, y, lt, t0, { c = PAL.white, cps = 32, lh = 11, s = 1 } = {}) {
  let t = t0;
  lines.forEach((ln, i) => {
    const str = typeof ln === 'string' ? ln : ln[0];
    const col = typeof ln === 'string' ? c : ln[1];
    const rev = (lt - t) * cps;
    if (rev > 0) text(str, W / 2, y + i * lh, col, { s, reveal: rev });
    t += str.length / cps + 0.12;
  });
  return t;
}

// ============================================================
//  Elementos de cena
// ============================================================
const STARS = (() => { const r = rng(42), a = []; for (let i = 0; i < 170; i++) a.push([r() * W | 0, r() * H | 0, r(), r() * 6.28]); return a; })();
function space(t, top = PAL.space, bottom = PAL.space2) {
  for (let y = 0; y < H; y++) {
    const f = y / H;
    for (let x = 0; x < W; x++) buf[y * W + x] = bayer(x, y) < f * 0.9 ? bottom : top;
  }
  for (const [x, y, b, ph] of STARS) {
    const tw = Math.sin(t * 2.2 + ph);
    px(x, y, b > 0.85 ? (tw > 0.2 ? PAL.star : PAL.star2) : b > 0.45 ? PAL.star2 : PAL.star3);
    if (b > 0.97 && tw > 0.6) { px(x - 1, y, PAL.star3); px(x + 1, y, PAL.star3); px(x, y - 1, PAL.star3); px(x, y + 1, PAL.star3); }
  }
}

// Globo com textura procedural, iluminação em 3 tons e dithering no terminador.
// yaw gira a Terra; tilt inclina a câmera (mostra mais o hemisfério norte).
const LIGHT = (() => { const v = [-0.55, 0.5, 0.67]; const m = Math.hypot(...v); return v.map(a => a / m); })();
function earthColor(lon, lat, shade, x, y, t, clouds = true) {
  const u = (lon / (Math.PI * 2) + 1) * 14, v = (lat / Math.PI + 0.5) * 9;
  const n = 0.62 * vnoise(u, v, 14) + 0.38 * vnoise(u * 2.3, v * 2.3, 32.2);
  let col;
  const ice = Math.abs(lat) > 1.22 + 0.08 * vnoise(u * 3, v * 3, 42);
  const isLand = n > 0.56;
  const day = shade + (bayer(x, y) - 0.5) * 0.25 > 0;
  if (!day) {
    if (ice) return PAL.nightO;
    if (isLand) return (n > 0.62 && hash(Math.floor(u * 9), Math.floor(v * 9)) > 0.86) ? PAL.city : PAL.nightL;
    return PAL.nightO;
  }
  const bright = shade + (bayer(x, y) - 0.5) * 0.3 > 0.62;
  if (ice) col = PAL.ice;
  else if (isLand) col = n > 0.66 ? (bright ? PAL.land : PAL.landD) : (n < 0.585 ? PAL.sand : (bright ? PAL.landL : PAL.land));
  else col = bright ? PAL.ocean : (shade < 0.25 ? PAL.oceanD : PAL.ocean);
  if (bright && !isLand && !ice && n > 0.5) col = PAL.oceanL;
  if (clouds) {
    const cn = vnoise(u * 1.7 + t * 0.15, v * 2.2, 23.8) * 0.6 + vnoise(u * 4, v * 5, 56) * 0.4;
    if (cn > 0.68) col = shade > 0.35 ? PAL.cloud : PAL.cloudD;

}
function globe(cx, cy, r, yaw, tilt, t, { glow = true, clouds = true } = {}) {
  const ct = Math.cos(tilt), st = Math.sin(tilt), cy_ = Math.cos(yaw), sy_ = Math.sin(yaw);
  const x0 = Math.max(0, Math.floor(cx - r - 3)), x1 = Math.min(W - 1, Math.ceil(cx + r + 3));
  const y0 = Math.max(0, Math.floor(cy - r - 3)), y1 = Math.min(H - 1, Math.ceil(cy + r + 3));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const dx = (x + 0.5 - cx) / r, dy = (y + 0.5 - cy) / r, d2 = dx * dx + dy * dy;
    if (d2 > 1) {
      if (glow) {
        const d = Math.sqrt(d2) * r - r;
        if (d < 1.2) buf[y * W + x] = PAL.atmo;
        else if (d < 2.6 && bayer(x, y) < 0.55) buf[y * W + x] = PAL.atmo2;

    let col = earthColor(Math.atan2(Y, X), Math.asin(Math.max(-1, Math.min(1, Z))), shade, x, y, t, clouds);

// projeção de um ponto do mundo para a tela usando a mesma câmera do globo
function project(p, cx, cy, r, yaw, tilt) {

  const Y2 = Y1 * ct - Z1 * st, Z2 = Y1 * st + Z1 * ct;
  return { x: cx + X1 * r, y: cy - Z2 * r, z: -Y2 };

// Satélite Starlink estilizado: corpo chato + um painel solar longo
function satellite(x, y, { flip = false, glow = false, t = 0, scale = 1 } = {}) {
  x = Math.round(x); y = Math.round(y);
  const s = scale, d = flip ? -1 : 1;
  // painel solar
  for (let i = 0; i < 9; i++) for (let j = 0; j < 3; j++) {
    const c = (i % 3 === 2) ? PAL.panelD : (j === 0 ? PAL.panelL : PAL.panel);

function dishIcon(x, y, angle = -0.6) { // antena retangular do usuário sobre um mastro

function cloudIcon(cx, cy, t) {
  const blobs = [[-9, 2, 6], [-2, -3, 8], [8, 0, 6], [0, 4, 6], [12, 4, 4], [-13, 5, 3]];
  for (const [ox, oy, r] of blobs) disc(cx + ox, cy + oy, r, PAL.cloudD);
  for (const [ox, oy, r] of blobs) disc(cx + ox, cy + oy - 1, r - 1, PAL.white);

}
function packet(x, y, c = PAL.yellow, t = 0) {
  const k = Math.sin(t * 20) > 0;

  if (k) { px(x - 2, y, c); px(x + 2, y, c); px(x, y - 2, c); px(x, y + 2, c); }

function alongPath(pts, f) { // posição ao longo de uma polilinha, f ∈ [0,1]
  const seg = []; let L = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); L += l; }
  let d = Math.max(0, Math.min(1, f)) * L;
  for (let i = 0; i < seg.length; i++) {
    if (d <= seg[i] || i === seg.length - 1) {
      const k = seg[i] ? d / seg[i] : 0;
      return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k, i];
    }

function header(n, title, lt) {
  const slide = Math.min(1, lt / 0.35);
  const y = Math.round(-30 + 38 * (1 - Math.pow(1 - slide, 3)));

    const tag = `PASSO ${n}/6`;
    rect(W / 2 - textW(tag) / 2 - 3, y - 2, textW(tag) + 6, 11, PAL.tagBg);

const PLANES = (() => {
  const a = [];
  for (let k = 0; k < 12; k++) a.push({ inc: 53 * Math.PI / 180, raan: k * Math.PI / 6, n: 11, c: PAL.white, R: 1.13, ph: k * 0.3 });

  // embaralha a ordem de aparição sem misturar as camadas
  return a;
})();

  // órbitas e satélites atrás do globo primeiro
  const front = [];
  for (let pi = 0; pi < shown; pi++) {

    for (let s = 0; s < 72; s++) {
      const q = project(orbitPoint(P.inc, P.raan, s / 72 * Math.PI * 2, P.R), cx, cy, r, yaw, tilt);
      const hidden = q.z < 0 && Math.hypot(q.x - cx, q.y - cy) < r + 1;
      if (!hidden && s % 2 === 0) (q.z < 0 ? px(q.x, q.y, PAL.star3) : front.push([q.x, q.y, PAL.tagBg, 0]));

});

function rocket(x, y, t, fairingOpen = 0) {
  x = Math.round(x); y = Math.round(y);
  rect(x - 2, y, 5, 46, PAL.white); rect(x + 1, y, 2, 46, PAL.grayL);
  rect(x - 2, y + 16, 5, 2, PAL.black); // interstage
  rect(x - 3, y + 42, 7, 4, PAL.grayD); // pernas recolhidas
  text('X', x, y + 24, PAL.panelD, { sh: null, s: 1 });
  // coifa (fairing)
  const o = Math.round(fairingOpen * 10);
  for (let j = 0; j < 12; j++) {
    const w = Math.min(3, 1 + Math.floor(j / 3));
    rect(x - w - o, y - 12 + j, w, 1, PAL.white);
    rect(x + 1 + o - (o ? 0 : 1) + (o ? 0 : 0), y - 12 + j, w, 1, PAL.grayL);
  }
  if (!fairingOpen) rect(x - 1, y - 12, 3, 12, PAL.white);
  // chama
  for (let j = 0; j < 14; j++) for (let i = -3; i <= 3; i++) {
    const v = hash(i + Math.floor(t * 30), j) + (j / 14);
    if (Math.abs(i) <= 3 - j / 5 && v < 1.15) px(x + i, y + 46 + j, j < 3 ? PAL.white : v < 0.7 ? PAL.yellow : v < 0.95 ? PAL.orange : PAL.red);
  }
}

  steps.forEach(([a, b, icon], i) => {
    const at = 0.5 + i * 0.9;
    if (lt < at) return;
    const y = y0 + i * dy;
    rect(10, y - 4, 160, 30, PAL.tagBg);
    const active = lt > 5.0 && Math.floor((lt - 5.0) * 1.6) % 5 === i;
    rect(10, y - 4, 3, 30, active ? PAL.yellow : (i === 2 ? PAL.laser : PAL.cyan));
    if (active) { rect(10, y - 4, 160, 1, PAL.yellow); rect(10, y + 25, 160, 1, PAL.yellow); }
    icon(30, y + 10);
    text(a, 50, y + 2, i === 2 ? PAL.laser : PAL.white, { align: 'left', reveal: (lt - at) * 40 });
    text(b, 50, y + 13, PAL.gray, { align: 'left', reveal: (lt - at - 0.2) * 40, sh: null });
    if (i < steps.length - 1) text('↓', 30, y + 28, PAL.yellow, { sh: null });
  });
  typeLines(['INTERNET VIA ESPAÇO', ['COM BAIXA LATÊNCIA', PAL.yellow]], 284, lt, 5.0, { lh: 12 });
});

// ============================================================
//  Transições (dithering) e loop principal
// ============================================================
const TOTAL = SCENES.reduce((a, s) => a + s.dur, 0);
const FADE = 0.45;
function fadeOverlay(a) { // a ∈ [0,1]: 1 = preto total
  if (a <= 0) return;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (bayer(x >> 1, y >> 1) < a) buf[y * W + x] = PAL.black;
}
function renderAt(t) {
  t = ((t % TOTAL) + TOTAL) % TOTAL;
  let acc = 0;
  for (let i = 0; i < SCENES.length; i++) {
    const s = SCENES[i];
    if (t < acc + s.dur || i === SCENES.length - 1) {
      const lt = t - acc;
      s.fn(lt, t);
      const a = Math.max(lt < FADE ? 1 - lt / FADE : 0, lt > s.dur - FADE ? (lt - (s.dur - FADE)) / FADE : 0);
      fadeOverlay(a);
      break;
    }
    acc += s.dur;
  }
  ctx.putImageData(img, 0, 0);
}
// exportação de quadros (usada pelo render.mjs)
window.__starlink = {
  W, H, TOTAL, renderAt,
  frameB64(t) { renderAt(t); const u8 = new Uint8Array(img.data.buffer); let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); },
};

const params = new URLSearchParams(location.search);
let paused = params.has('t'), clock = parseFloat(params.get('t') || '0'), last = performance.now();
function sceneStart(i) { let a = 0; for (let k = 0; k < i; k++) a += SCENES[k].dur; return a; }
function currentScene() { let a = 0; for (let i = 0; i < SCENES.length; i++) { a += SCENES[i].dur; if (clock % TOTAL < a) return i; } return 0; }
cv.addEventListener('click', () => { paused = !paused; });
addEventListener('keydown', (e) => {
  if (e.key === ' ') paused = !paused;
  if (e.key === 'ArrowRight') clock = sceneStart((currentScene() + 1) % SCENES.length) + 0.01;
  if (e.key === 'ArrowLeft') clock = sceneStart((currentScene() + SCENES.length - 1) % SCENES.length) + 0.01;
});
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!paused) clock += dt;
  if (!params.has('record')) renderAt(clock);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
